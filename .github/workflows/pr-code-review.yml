name: PR Code Review (Godot Best Practices, Lint & Coverage)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pr-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  godot-code-review:
    name: Godot Code Review & Coverage Audit
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"

    steps:
      - name: Checkout repository (full history for PR diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python & gdtoolkit
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit (gdlint & gdformat)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'gdtoolkit==4.*'

      - name: Setup Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Warm-up headless import & validate scripts/scenes
        id: validate
        run: |
          mkdir -p "$RUNNER_TEMP/godot_home"
          HOME="$RUNNER_TEMP/godot_home" godot --headless --path . --import --quit
          if HOME="$RUNNER_TEMP/godot_home" godot --headless --path . -s tools/validate_project.gd 2>&1 | tee validate.log && \
             ! grep -qE "SCRIPT ERROR:|Parse Error:|Failed to load script" validate.log; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gdlint (GDScript Style & Complexity)
        run: |
          gdlint scripts tests > gdlint.log 2>&1 || true
          cat gdlint.log

      - name: Check formatting on changed GDScripts (gdformat)
        id: gdformat
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
          CHANGED_GD=$(git diff --name-only --diff-filter=ACMRT "origin/$BASE_REF...HEAD" -- '*.gd' || true)
          if [ -z "$CHANGED_GD" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED_GD" | xargs gdformat --line-length 160 --check; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect Coverage (LCOV + JSON)
        run: |
          python3 tools/gd_coverage.py --min-coverage 60

      - name: Run Godot Best-Practices & Diff Coverage Review
        id: review
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          python3 tools/gd_review.py \
            --base-ref "origin/$BASE_REF" \
            --coverage-json coverage/coverage.json \
            --gdlint-log gdlint.log \
            --gdformat-status "${{ steps.gdformat.outputs.status }}" \
            --validate-status "${{ steps.validate.outputs.status }}" \
            --min-coverage 60 \
            --fail-on-error
          cat review/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post / Update PR Code Review Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('review/report.md')) return;
            const marker = '<!-- bedlion-godot-code-review -->';
            const body = `${marker}\n${fs.readFileSync('review/report.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Optional AI Semantic Godot Review (Gemini)
        if: github.event_name == 'pull_request' && env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const baseRef = process.env.GITHUB_BASE_REF || 'main';
            let diff = '';
            try {
              diff = execSync(`git diff origin/${baseRef}...HEAD -- '*.gd' 'project.godot' 'scenes/*.tscn'`, { maxBuffer: 1024 * 1024 }).toString();
            } catch (e) {
              return;
            }
            if (!diff.trim()) return;
            const prompt = [
              'Você é um revisor sênior especialista em Godot 4 (GDScript).',
              'Analise o diff do PR abaixo focando em: bugs sutis de ciclo de vida/nós (queue_free, is_instance_valid, sinais),',
              'performance em _process/_physics_process/_draw, física 2D, tipagem estática e cobertura de testes.',
              'Seja objetivo, cite arquivo e linha, e só aponte problemas reais.',
              '',
              '```diff',
              diff.slice(0, 28000),
              '```'
            ].join('\n');

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
              }
            );
            if (!res.ok) {
              core.warning(`Gemini AI review HTTP ${res.status}`);
              return;
            }
            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) return;

            const marker = '<!-- bedlion-ai-code-review -->';
            const body = `${marker}\n## 🧠 AI Semantic Code Review (Godot 4)\n\n${text}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload Code Review Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-artifacts
          path: |
            review/report.md
            review/report.json
            gdlint.log
            validate.log
            coverage/lcov.info
            coverage/coverage.json
          retention-days: 14
