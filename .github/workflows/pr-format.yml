name: PR Format (gdformat)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
    paths:
      - "**/*.gd"
      - ".gdlintrc"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  format-check:
    name: GDScript Format Check
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python & gdtoolkit
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: python -m pip install 'gdtoolkit==4.*'

      - name: Check formatting on changed GDScripts (gdformat)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref || 'main' }}"
            git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
            CHANGED_GD=$(git diff --name-only --diff-filter=ACMRT "origin/$BASE_REF...HEAD" -- '*.gd' || true)
            if [ -z "$CHANGED_GD" ]; then
              echo "Nenhum arquivo .gd alterado neste PR."
              exit 0
            fi
            echo "$CHANGED_GD" | xargs gdformat --line-length 160 --check
          else
            gdformat --line-length 160 --check scripts tests
          fi

  auto-format-pr:
    name: Auto-format PR on /format
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/format')
    runs-on: ubuntu-latest
    steps:
      - name: Get PR branch info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('is_same_repo', String(pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`));

      - name: Checkout PR branch
        if: steps.pr.outputs.is_same_repo == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}

      - name: Setup Python & gdtoolkit
        if: steps.pr.outputs.is_same_repo == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gdformat & commit changes
        if: steps.pr.outputs.is_same_repo == 'true'
        run: |
          python -m pip install 'gdtoolkit==4.*'
          gdformat --line-length 160 scripts tests
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts tests
            git commit -m "style: format GDScript files with gdformat"
            git push
          fi
