name: PR Tests (Godot Headless + Unit + Fuzz + Coverage)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fuzz_seed:
        description: "Seed determinística para fuzzy testing (ou 'random')"
        required: false
        default: "20261116"
      fuzz_iterations:
        description: "Número de iterações por propriedade de fuzz"
        required: false
        default: "200"

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  headless-tests:
    name: Headless Unit & Fuzz Tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
      FUZZ_SEED: ${{ inputs.fuzz_seed || '20261116' }}
      FUZZ_ITERATIONS: ${{ inputs.fuzz_iterations || '200' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Warm-up headless import
        run: |
          mkdir -p "$RUNNER_TEMP/godot_home"
          HOME="$RUNNER_TEMP/godot_home" godot --headless --path . --import --quit

      - name: Validate all GDScripts and Scenes
        run: |
          set -o pipefail
          HOME="$RUNNER_TEMP/godot_home" godot --headless --path . -s tools/validate_project.gd 2>&1 | tee validate.log
          if grep -qE "SCRIPT ERROR:|Parse Error:|Failed to load script" validate.log; then
            echo "::error::Godot script/scene validation detected errors!"
            exit 1
          fi

      - name: Run Unit & Fuzzy Tests (Headless)
        run: |
          set -o pipefail
          HOME="$RUNNER_TEMP/godot_home" godot --headless --path . -s tests/test_runner.gd -- \
            --fuzz-seed="$FUZZ_SEED" \
            --fuzz-iterations="$FUZZ_ITERATIONS" 2>&1 | tee test-output.log
          if grep -qE "SCRIPT ERROR:|Parse Error:" test-output.log; then
            echo "::error::Runtime SCRIPT ERROR detected during headless tests (fuzz_seed=$FUZZ_SEED)!"
            exit 1
          fi

      - name: Collect GDScript Line Coverage (LCOV)
        run: |
          python3 tools/gd_coverage.py \
            --min-coverage 60 \
            --fuzz-seed "$FUZZ_SEED" \
            --fuzz-iterations "$FUZZ_ITERATIONS"
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Logs & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-artifacts
          path: |
            test-output.log
            validate.log
            coverage/lcov.info
            coverage/coverage.json
            coverage/summary.md
          retention-days: 14
